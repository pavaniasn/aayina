<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <nav>
    <a class="nav-brand" href="{{ '/' | relative_url }}">Aayina</a>
    <ul class="nav-links">
      <li><a href="{{ '/spoken-word/' | relative_url }}">Spoken Word</a></li>
      <li><a href="{{ '/poems/' | relative_url }}">Poems</a></li>
      <li><a href="{{ '/reflections/' | relative_url }}">Reflections</a></li>
    </ul>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <span>Aayina &mdash; all words are my own</span>
  </footer>

</body>
</html>
